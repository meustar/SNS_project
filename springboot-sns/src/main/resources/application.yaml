spring:
  application:
    name: springboot-sns

  # 세션 설정
  session:
    store-type: redis # 세션 저장소로 Redis 사용
    timeout: 30m      # 세션 만료 시간 30분
    redis:
      namespace: spring:session

  # Redis 연결 설정
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 비밀번호 없음 (개발용)

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
